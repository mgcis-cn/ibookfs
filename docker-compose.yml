################################################################################
# iBookFS Docker Compose
# 
# 服务组件：
# - app: iBookFS 主应用
# - db: PostgreSQL 数据库
# - redis: Redis 缓存（可选）
################################################################################

services:
  # ===========================================================================
  # iBookFS 应用服务
  # ===========================================================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ibookfs:latest
    container_name: ibookfs-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ibookfs}
      - DB_PASSWORD=${DB_PASSWORD:-ibookfs123}
      - DB_NAME=${DB_NAME:-ibookfs}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./configs/config.yaml:/app/configs/config.yaml:ro
      - ibookfs-data:/app/data
      - ibookfs-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - ibookfs-network

  # ===========================================================================
  # PostgreSQL 数据库
  # ===========================================================================
  db:
    image: postgres:16-alpine
    container_name: ibookfs-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-ibookfs}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ibookfs123}
      - POSTGRES_DB=${DB_NAME:-ibookfs}
      - TZ=Asia/Shanghai
      - PGTZ=Asia/Shanghai
    volumes:
      - ibookfs-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ibookfs} -d ${DB_NAME:-ibookfs}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - ibookfs-network

  # ===========================================================================
  # Redis 缓存（可选）
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: ibookfs-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - ibookfs-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibookfs-network

# =============================================================================
# 网络配置
# =============================================================================
networks:
  ibookfs-network:
    driver: bridge

# =============================================================================
# 数据卷
# =============================================================================
volumes:
  ibookfs-data:
    driver: local
  ibookfs-logs:
    driver: local
  ibookfs-postgres:
    driver: local
  ibookfs-redis:
    driver: local
