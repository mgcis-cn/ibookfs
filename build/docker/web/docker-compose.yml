################################################################################
# iBookFS Web Frontend Docker Compose
################################################################################

services:
  web:
    build:
      context: ../../..
      dockerfile: build/docker/web/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-/api/v1}
    image: ibookfs-web:${VERSION:-latest}
    container_name: ibookfs-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - apiserver_ibookfs

networks:
  apiserver_ibookfs:
    external: true
