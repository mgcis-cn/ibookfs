################################################################################
# iBookFS API Server Docker Compose
################################################################################

services:
  apiserver:
    build:
      context: ../../..
      dockerfile: build/docker/apiserver/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
        BUILD_TIME: ${BUILD_TIME:-}
    image: ibookfs-apiserver:${VERSION:-latest}
    container_name: ibookfs-apiserver
    command: ["--env", "prod"]
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      - TZ=Asia/Shanghai
      - GIN_MODE=release
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=${DB_USER:-ibookfs}
      - DB_PASSWORD=${DB_PASSWORD:-ibookfs123}
      - DB_NAME=${DB_NAME:-ibookfs}
    volumes:
      - apiserver-data:/app/data
      - apiserver-logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - ibookfs

  db:
    image: postgres:16-alpine
    container_name: ibookfs-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER:-ibookfs}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-ibookfs123}
      - POSTGRES_DB=${DB_NAME:-ibookfs}
      - TZ=Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-ibookfs}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ibookfs

networks:
  ibookfs:
    driver: bridge

volumes:
  apiserver-data:
  apiserver-logs:
  postgres-data:
